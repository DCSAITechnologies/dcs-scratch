openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: DCS Connector OS API
  version: 1.0.0
  summary: Governed connector execution — connectors, connections, runs, approvals, executions and receipts.
  description: |
    The public, versioned Connector OS API (`/v1`).

    **Maturity.** Every operation carries `x-dcs-maturity`:
    `WIRED` (reads a canonical in-repo source through its owning package),
    `HERMETIC` (implemented by the reference server over in-memory adapters — not persistence, not deployed),
    `CONTRACT_ONLY` (specified; the reference server answers `501 not_implemented`).
    `x-dcs-production-blocker` names what production wiring still needs. **Nothing in this document is
    production-deployed.** No connector is dispatchable in staging or production today; the API reports
    that truthfully through `Connector.dispatch`.

    **Governance path.** Every consequential action goes
    `API → policy (OAL) → approval (human) → ops-broker → execution engine`. No handler calls a connector
    or a provider. MODE 2 (execution) is locked until the ops-broker asserts readiness; while it is
    locked, `POST /v1/executions` answers `409 mode_locked`.

    **Outcomes.** `Execution.outcome` is the frozen EXEC-FACTS v1 enum, passed through verbatim.
    `OUTCOME_UNKNOWN` means the provider may or may not have applied the effect: it is **not a failure**
    and is **never retried** before reconciliation. Receipt status (`Execution.receipt.status`) is a
    separate field and never stands in for the execution outcome.

    **Receipts.** Connector OS performs no receipt cryptography. Verification is delegated to the
    R-Series verifier; a result is `verified` only when an R-Series-kind verifier says so.

    **Versioning.** See `x-dcs-versioning`. Breaking changes ship only under a new path major (`/v2`).
  contact:
    name: DCS AI Technologies India Private Limited
  license:
    name: Proprietary — pre-launch, not published
    identifier: LicenseRef-DCS-Proprietary
x-dcs-contract:
  status: FROZEN
  frozen_on: '2026-09-28'
  lane: L5
  base_sha: c40cd913bd8b6e4c24c5453d598819ea8d7431ed
  sources:
    - contracts/v1.3/exec-facts.v1.json
    - contracts/v1/errors.v1.json
    - contracts/v1/tool-result.v1.json
    - contracts/v1.3/webhook-contract.v1.json
    - packages/registry/data/dispatch-eligibility.json
    - 'ec49ad8: packages/oal-runtime/src/schemas.mjs'
    - 'ec49ad8: packages/ops-broker/src/{broker,approvals,kill-switch}.mjs'
    - 'ec49ad8: packages/runtime/src/{evidence-slot,connection}.mjs'
x-dcs-versioning:
  path_major: v1
  contract_version_header: DCS-API-Version
  compatible_changes: [new operations, new optional request fields, new response fields, new values in enums marked x-dcs-enum-open]
  breaking_changes_require: a new path major (/v2) — never shipped under /v1
  closed_enums: Enums marked x-dcs-enum-closed come from frozen contracts (EXEC-FACTS, errors.v1, OAL schemas) and change only with those contracts.
  deprecation: 'A deprecated operation keeps working and answers with `Deprecation` (RFC 9745) and `Sunset` (RFC 8594) headers plus `Link: <…>; rel="deprecation"`. Minimum notice between the first Deprecation header and Sunset: 180 days.'
x-dcs-header-sets:
  standard: &std
    X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
    X-Correlation-Id: {$ref: '#/components/headers/X-Correlation-Id'}
    DCS-API-Version: {$ref: '#/components/headers/DCS-API-Version'}
    DCS-Adapter: {$ref: '#/components/headers/DCS-Adapter'}
    RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
    RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
    RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
  write: &write
    X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
    X-Correlation-Id: {$ref: '#/components/headers/X-Correlation-Id'}
    DCS-API-Version: {$ref: '#/components/headers/DCS-API-Version'}
    DCS-Adapter: {$ref: '#/components/headers/DCS-Adapter'}
    RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
    RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
    RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
    Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
servers:
  - url: http://127.0.0.1:4010
    description: Hermetic reference server (devex/api-server). In-memory adapters; not persistence; not deployed.
  - url: https://api.connector-os.example/v1-not-deployed
    description: Placeholder. No staging or production endpoint exists yet (Lane 4 owns deployment).
security:
  - apiKey: []
tags:
  - name: Connectors
  - name: Connections
  - name: Runs
  - name: Approvals
  - name: Executions
  - name: Receipts
  - name: Policies
  - name: Events
  - name: Webhooks
  - name: Environments
  - name: Usage
  - name: Identity
  - name: Operator
    description: Privileged surfaces. Human operator session required; never available to API keys.

paths:
  /v1/me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Describe the calling credential
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: BLOCKED_BY_LANE3 (IdP / API-key issuance)
      security: [{apiKey: []}, {operatorSession: []}]
      responses:
        '200':
          description: The credential's principal, tenant, environment and scopes. Never the secret.
          headers: *std
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Principal'}
              examples:
                apiKey:
                  value: {object: principal, kind: api_key, principal_id: key_ci_7f3a, tenant_id: ten_demo, environment: hermetic, scopes: ['connectors:read', 'runs:read'], capabilities: [], key_prefix: cosk_hermetic_}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/connectors:
    get:
      tags: [Connectors]
      operationId: listConnectors
      summary: List catalogued connectors with their real dispatch eligibility
      x-dcs-maturity: WIRED
      x-dcs-production-blocker: deploy (Lane 4)
      x-dcs-scope: connectors:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: disposition
          in: query
          schema: {$ref: '#/components/schemas/ConnectorDisposition'}
        - name: q
          in: query
          description: Case-insensitive substring match on connector_id or name.
          schema: {type: string, maxLength: 64}
      responses:
        '200':
          description: A page of connectors.
          headers: *std
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/Connector'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/connectors/{connector_id}:
    get:
      tags: [Connectors]
      operationId: getConnector
      summary: Get one connector
      x-dcs-maturity: WIRED
      x-dcs-production-blocker: deploy (Lane 4)
      x-dcs-scope: connectors:read
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
      responses:
        '200':
          description: The connector.
          headers: *std
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Connector'}
              examples:
                deepl:
                  value:
                    object: connector
                    connector_id: deepl
                    name: DeepL
                    pack: F01
                    engineering_rank: 1
                    generation: v1
                    disposition: CODED_LOCALLY_TESTED
                    availability: not_dispatchable
                    dispatch: {staging: false, production: false, reasons: [not_integrated], production_reasons: [not_staging_verified]}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/connections:
    get:
      tags: [Connections]
      operationId: listConnections
      summary: List connections in the caller's tenant
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: BLOCKED_BY_LANE3 (connection store)
      x-dcs-scope: connections:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: connector_id
          in: query
          schema: {$ref: '#/components/schemas/ConnectorIdValue'}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ConnectionStatus'}
      responses:
        '200':
          description: A page of connections.
          headers: *std
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/Connection'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Connections]
      operationId: createConnection
      summary: Register a connection by credential reference
      description: |
        Creates a connection in status `CREATED`. The body carries a **credential reference**
        (`cref_<uuid>`) issued by the vault — never a secret. Any field that looks like a secret
        (`access_token`, `api_key`, `client_secret`, `password`, …) is refused with `400 secret_in_request`.
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: BLOCKED_BY_LANE3 (vault / credential lifecycle) + EXTERNAL_DEPENDENCY (provider app registrations)
      x-dcs-scope: connections:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectionCreate'}
            examples:
              simulator:
                value: {connector_id: github, credential_ref: cref_0b6f5d3e-3c1a-4b8e-9d2f-1a2b3c4d5e6f, routing: {target: simulator, environment: staging}, label: ci-bot}
      responses:
        '201':
          description: Connection created.
          headers: *write
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Connection'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/IdempotencyConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/connections/{connection_id}:
    get:
      tags: [Connections]
      operationId: getConnection
      summary: Get one connection
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: BLOCKED_BY_LANE3 (connection store)
      x-dcs-scope: connections:read
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: The connection. A connection in another tenant is reported as 404.
          headers: *std
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Connection'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/connections/{connection_id}/test:
    post:
      tags: [Connections]
      operationId: testConnection
      summary: Run the connection's non-mutating test probe
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: BLOCKED_BY_LANE3 + EXTERNAL_DEPENDENCY (real provider probe; reference server tests simulator targets only)
      x-dcs-scope: connections:write
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '200':
          description: Test result; on success status moves CREATED→TESTED (or stays TESTED).
          headers: *write
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectionTestResult'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/IdempotencyConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/connections/{connection_id}/activate:
    post:
      tags: [Connections]
      operationId: activateConnection
      summary: Activate a tested connection (TESTED → ACTIVE)
      description: Legal only from `TESTED` (Runtime-E lifecycle). Anything else is `409 illegal_transition`.
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: BLOCKED_BY_LANE3 (connection store)
      x-dcs-scope: connections:write
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '200':
          description: Activated.
          headers: *write
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Connection'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/IdempotencyConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/runs:
    get:
      tags: [Runs]
      operationId: listRuns
      summary: List OAL runs
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: BLOCKED_BY_LANE3 (OAL run-state store) + integrate/v1-rc
      x-dcs-scope: runs:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/RunStatus'}
      responses:
        '200':
          description: A page of runs.
          headers: *std
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/Run'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Runs]
      operationId: createRun
      summary: Open an OAL run (trigger kind `operator`)
      description: Opens a run in `mode_0` or `mode_1`. `mode_2` is never opened through this call; execution is reached only through an approved plan step submitted to `POST /v1/executions`.
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: BLOCKED_BY_LANE3 + integrate/v1-rc
      x-dcs-scope: runs:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunCreate'}
            examples:
              diagnose:
                value: {mode: mode_1, objective: Investigate failing GitHub issue sync, connector_ids: [github], window_seconds: 3600}
      responses:
        '201':
          description: Run opened.
          headers: *write
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '422': {$ref: '#/components/responses/IdempotencyConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/runs/{run_id}:
    get:
      tags: [Runs]
      operationId: getRun
      summary: Inspect a run
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: BLOCKED_BY_LANE3
      x-dcs-scope: runs:read
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run, with its plans, approvals and executions referenced by id.
          headers: *std
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/runs/{run_id}/plans:
    post:
      tags: [Runs]
      operationId: createPlan
      summary: Request a recommendation-only plan for a run
      description: Plans are recommendations. Each step carries a policy decision; a `require_approval` step must be approved by a human before it can be submitted for execution.
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: BLOCKED_BY_LANE3 + integrate/v1-rc
      x-dcs-scope: runs:write
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanCreate'}
            examples:
              oneStep:
                value:
                  operator_explanation: Re-open the issue the sync closed by mistake
                  steps:
                    - {connector_id: github, tool_id: update_issue, operation_class: write, connection_id: conn_01hermetic0000000000000001, rationale: restore state}
      responses:
        '201':
          description: Plan created (recommendation only).
          headers: *write
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/IdempotencyConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/runs/{run_id}/plans/{plan_id}:
    get:
      tags: [Runs]
      operationId: getPlan
      summary: Get a plan
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: BLOCKED_BY_LANE3
      x-dcs-scope: runs:read
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: The plan.
          headers: *std
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      summary: List approvals
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: BLOCKED_BY_LANE3 (approval store)
      x-dcs-scope: approvals:read
      security: [{apiKey: []}, {operatorSession: []}]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: state
          in: query
          schema: {$ref: '#/components/schemas/ApprovalState'}
        - name: run_id
          in: query
          schema: {$ref: '#/components/schemas/RunIdValue'}
      responses:
        '200':
          description: A page of approvals.
          headers: *std
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/Approval'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Approvals]
      operationId: requestApproval
      summary: Request human approval for plan steps
      description: Creates an approval in state `REQUESTED`. Requesting never grants. Only a human operator can grant (`POST /v1/approvals/{id}/grant`).
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: BLOCKED_BY_LANE3 (approval store)
      x-dcs-scope: approvals:request
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalRequest'}
      responses:
        '201':
          description: Approval requested.
          headers: *write
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/IdempotencyConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/approvals/{approval_id}:
    get:
      tags: [Approvals]
      operationId: getApproval
      summary: Get an approval
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: BLOCKED_BY_LANE3
      x-dcs-scope: approvals:read
      security: [{apiKey: []}, {operatorSession: []}]
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      responses:
        '200':
          description: The approval. `state` is derived at read time (EXPIRED is never stored).
          headers: *std
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/approvals/{approval_id}/grant:
    post:
      tags: [Approvals]
      operationId: grantApproval
      summary: Grant (human operator only)
      description: Issues the OAL approval (`oal_status = ISSUED`). Requires a human operator session with the `approve` capability; an API key is refused with `403 human_required`.
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: BLOCKED_BY_LANE3 (IdP + operator attestation)
      x-dcs-capability: approve
      security: [{operatorSession: []}]
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalGrant'}
      responses:
        '200':
          description: Granted.
          headers: *write
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/IdempotencyConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/approvals/{approval_id}/deny:
    post:
      tags: [Approvals]
      operationId: denyApproval
      summary: Deny (human operator only)
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: BLOCKED_BY_LANE3 (IdP)
      x-dcs-capability: approve
      security: [{operatorSession: []}]
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonBody'}
      responses:
        '200':
          description: Denied.
          headers: *write
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
