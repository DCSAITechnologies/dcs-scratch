      responses:
        '200':
          description: A page of executions.
          headers: *std
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/Execution'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Executions]
      operationId: submitExecution
      summary: Submit an approved plan step for execution
      description: |
        Hands one approved plan step to the ops-broker. The handler never calls a connector: it
        re-reads the policy decision, consumes the approval atomically, and submits to the ops-broker,
        which checks the kill switch and dispatches through the execution engine.

        * `202` — accepted; the body is the execution as recorded so far. `outcome` may be any EXEC-FACTS
          value, including `BLOCKED` (kill switch after consumption) and `OUTCOME_UNKNOWN`.
        * `409 mode_locked` — MODE 2 is locked (the default until ops-broker readiness is asserted).
        * `409 broker_refused` — the broker refused before dispatch; `error.detail.refusal_code` is the
          broker's code verbatim (`APPROVAL-REQUIRED`, `APPROVAL-REPLAY`, `PLAN-HASH-MISMATCH`, …).

        Submitting the same approved step again never dispatches twice: the broker answers
        `APPROVAL-REPLAY`, and a repeated `Idempotency-Key` replays the original response.

        **Clients must not retry this call after an ambiguous transport failure** (timeout, connection
        reset, 502/504) except with the *same* `Idempotency-Key`, which makes the retry a replay.
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: BLOCKED_BY_LANE3 + integrate/v1-rc + MODE 2 readiness (ops-broker)
      x-dcs-scope: executions:write
      x-dcs-consequential: true
      security: [{apiKey: []}, {operatorSession: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/OperatorAttestation'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExecutionSubmit'}
            examples:
              approvedStep:
                value: {run_id: run_01hermetic00000001, plan_id: plan_01hermetic0000001, step_id: step_01hermetic0000001, approval_id: apr_01hermetic00000001}
      responses:
        '202':
          description: Accepted by the ops-broker.
          headers: *write
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Execution'}
              examples:
                outcomeUnknown:
                  summary: Ambiguous write — preserved exactly, never retried
                  value:
                    object: execution
                    execution_id: 5f0c1f7e-8a1b-4c2d-9e3f-0a1b2c3d4e5f
                    run_id: run_01hermetic00000001
                    plan_id: plan_01hermetic0000001
                    step_id: step_01hermetic0000001
                    approval_id: apr_01hermetic00000001
                    connector_id: github
                    connector_version: 1.0.0
                    tool_id: update_issue
                    operation_class: write
                    provider_idempotency_semantics: none
                    outcome: OUTCOME_UNKNOWN
                    settled: false
                    attempts:
                      - {attempt_n: 1, outcome: STARTED, recorded_at: '2026-09-28T10:00:00Z'}
                      - {attempt_n: 1, outcome: OUTCOME_UNKNOWN, error_class: timeout, reconciliation_ref: rcn_hermetic0001, recorded_at: '2026-09-28T10:00:05Z'}
                    reconciliation: {required: true, reconciliation_ref: rcn_hermetic0001, strategy: probe_by_idempotency_key, status: pending}
                    verification: {verification_ref: null, verdict: null}
                    receipt: {status: PENDING, receipt_id: null, verification: not_verified, evidence_grade: none}
                    created_at: '2026-09-28T10:00:00Z'
                    updated_at: '2026-09-28T10:00:05Z'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/IdempotencyConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

