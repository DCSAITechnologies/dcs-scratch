  /v1/executions:
    get:
      tags: [Executions]
      operationId: listExecutions
      summary: List executions
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: BLOCKED_BY_LANE3 (execution ledger)
      x-dcs-scope: executions:read
      parameters:
        - $ref: '#/components/parameters/Limit'
