      x-dcs-production-blocker: BLOCKED_BY_LANE3
      x-dcs-capability: view
      security: [{operatorSession: []}]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Parked executions, oldest first.
          headers: *std
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/Execution'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}

  /v1/operator/executions/{execution_id}/reconcile:
    post:
      tags: [Operator]
      operationId: reconcileExecution
      summary: Record the reconciled outcome of an OUTCOME_UNKNOWN execution
      description: The only legal transitions are `OUTCOME_UNKNOWN → SUCCEEDED | FAILED`, carried by evidence. Anything else is `409 illegal_transition`.
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: BLOCKED_BY_LANE3 + integrate/v1-rc
      x-dcs-capability: execute
      x-dcs-consequential: true
      security: [{operatorSession: []}]
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReconcileRequest'}
      responses:
        '200':
          description: Reconciled.
          headers: *write
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Execution'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/IdempotencyConflict'}

  /v1/operator/audit-exports:
    post:
      tags: [Operator]
      operationId: createAuditExport
      summary: Start an audit export
      x-dcs-maturity: CONTRACT_ONLY
      x-dcs-production-blocker: BLOCKED_BY_LANE3 (persistence + IdP)
      x-dcs-capability: view
      security: [{operatorSession: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuditExportCreate'}
      responses:
        '202':
          description: Export accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditExport'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '501': {$ref: '#/components/responses/NotImplemented'}

  /v1/operator/audit-exports/{export_id}:
    get:
      tags: [Operator]
      operationId: getAuditExport
      summary: Get an audit export
      x-dcs-maturity: CONTRACT_ONLY
      x-dcs-production-blocker: BLOCKED_BY_LANE3
      x-dcs-capability: view
      security: [{operatorSession: []}]
      parameters:
        - name: export_id
          in: path
          required: true
          schema: {type: string, pattern: '^aex_[A-Za-z0-9]{8,64}$'}
      responses:
        '200':
          description: The export.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditExport'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '501': {$ref: '#/components/responses/NotImplemented'}

  /v1/operator/eligibility:
    get:
      tags: [Operator]
      operationId: getEligibility
      summary: Dispatch eligibility (default-deny) per connector and environment
      x-dcs-maturity: WIRED
      x-dcs-production-blocker: deploy (Lane 4)
      x-dcs-capability: view
      security: [{operatorSession: []}]
      parameters:
        - name: connector_id
          in: query
          schema: {$ref: '#/components/schemas/ConnectorIdValue'}
        - name: tool_id
          in: query
          schema: {type: string, maxLength: 128}
        - name: environment
          in: query
          schema: {type: string, enum: [staging, production], default: production}
      responses:
        '200':
          description: Summary, and a per-connector check when connector_id is given.
          headers: *std
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EligibilityReport'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}

  /v1/operator/provider-health:
    get:
      tags: [Operator]
      operationId: getProviderHealth
      summary: Connection health rolled up per connector
      x-dcs-maturity: HERMETIC
      x-dcs-production-blocker: EXTERNAL_DEPENDENCY (real provider probes) + BLOCKED_BY_LANE3
      x-dcs-capability: view
      security: [{operatorSession: []}]
      responses:
        '200':
          description: Health rollup.
          headers: *std
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: {const: list}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ProviderHealth'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}

webhooks:
  event:
    post:
      operationId: deliverEvent
      summary: Outbound event delivery to a subscribed endpoint (CONTRACT_ONLY)
      description: |
        Delivery contract for outbound events. **No delivery service exists yet (PLANNED)**, and the
        signature scheme is **not defined** (founder decision FD-L5-1). Until it is, `DCS-Signature`
        is absent and every delivery must be treated as an untrusted trigger (the Webhook Contract v1
        `untrusted_trigger_only` treatment): re-read the referenced resource through the API before
        acting on it.

        Receivers must: reject a timestamp outside their replay window (both past and future skew),
        deduplicate on `DCS-Event-Id` (identical across redeliveries), and answer 2xx only after
        durably recording the delivery.
      x-dcs-maturity: CONTRACT_ONLY
      x-dcs-production-blocker: PLANNED (delivery service) + FD-L5-1 (signing scheme)
      parameters:
        - name: DCS-Event-Id
          in: header
          required: true
          schema: {$ref: '#/components/schemas/EventIdValue'}
        - name: DCS-Event-Timestamp
          in: header
          required: true
          description: Unix seconds at which this delivery attempt was sent.
          schema: {type: string, pattern: '^[0-9]{9,11}$'}
        - name: DCS-Event-Type
          in: header
          required: true
          schema: {$ref: '#/components/schemas/EventType'}
        - name: DCS-Signature
          in: header
          required: false
          description: RESERVED. Scheme not defined (FD-L5-1). Absent today.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Event'}
      responses:
        '200':
          description: Recorded (or already recorded — duplicates are acknowledged, not reprocessed).

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: 'cosk_<environment>_<secret>'
      description: |
        Machine credential. Bound to one tenant and one environment; carries scopes
        (`connectors:read`, `connections:read`, `connections:write`, `runs:read`, `runs:write`,
        `approvals:read`, `approvals:request`, `executions:read`, `executions:write`, `receipts:read`,
        `receipts:verify`, `policies:read`, `events:read`, `webhooks:read`, `webhooks:write`,
        `environments:read`, `usage:read`). **An API key can never grant an approval, kill or restore.**
        Issuance is BLOCKED_BY_LANE3 (identity); the reference server accepts fixed hermetic test keys.
    operatorSession:
      type: http
      scheme: bearer
      bearerFormat: 'coso_<session>'
      description: |
        Human operator session from the tenant's IdP. Carries capabilities from the shared role model
        (`configure`, `approve`, `execute`, `kill`, `restore`, `view`). Its principal is always
        `kind: human`. BLOCKED_BY_LANE3 (IdP/RBAC seam); the reference server accepts fixed hermetic test sessions.

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `next_cursor`. Cursors are stable under concurrent writes and expire after 24 h.
      schema: {type: string, maxLength: 512}
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Request-level replay protection (8–255 chars, `[A-Za-z0-9_.:-]`). Same key + same body within
        24 h after a **successful (2xx)** response → that response is replayed with
        `Idempotent-Replayed: true`. Same key + different body → `422 idempotency_key_reuse`. A refused
        or failed request had no effect and is not recorded: re-sending its key is evaluated afresh
        (so a submission refused before a human granted its approval succeeds once granted). This key is **never** used as the execution idempotency key,
        which the ops-broker mints.
      schema: {$ref: '#/components/schemas/IdempotencyKeyValue'}
    OperatorAttestation:
      name: DCS-Operator-Attestation
      in: header
      required: true
      description: Reference to a human operator attestation for this submission (issued by the tenant's IdP). The broker verifies it to `{kind:'human', tenant_id, principal_id, attestation_ref}`.
      schema: {type: string, pattern: '^att_[A-Za-z0-9_-]{8,128}$'}
    ConnectorId:
      name: connector_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ConnectorIdValue'}
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ConnectionIdValue'}
    RunId:
      name: run_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/RunIdValue'}
    PlanId:
      name: plan_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/PlanIdValue'}
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ApprovalIdValue'}
    ExecutionId:
      name: execution_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ReceiptId:
      name: receipt_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ReceiptIdValue'}
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema: {type: string, pattern: '^whe_[A-Za-z0-9]{8,64}$'}

  headers:
    X-Request-Id:
      description: Server-assigned id for this HTTP request. Quote it in support requests.
      schema: {type: string, pattern: '^req_[A-Za-z0-9]{16,64}$'}
    X-Correlation-Id:
      description: Echo of the client's `X-Correlation-Id` when supplied (1–128 chars of `[A-Za-z0-9_.:-]`), otherwise equal to X-Request-Id.
      schema: {type: string, maxLength: 128}
    DCS-API-Version:
      description: Contract version of the answering server.
      schema: {type: string, const: 1.0.0}
    DCS-Adapter:
      description: '`hermetic` when answered by in-memory reference adapters; `production` otherwise. Never omitted.'
      schema: {type: string, enum: [hermetic, production]}
    RateLimit-Limit:
      description: Requests allowed in the current window.
      schema: {type: integer}
    RateLimit-Remaining:
      description: Requests left in the current window.
      schema: {type: integer}
    RateLimit-Reset:
      description: Seconds until the window resets.
      schema: {type: integer}
    Retry-After:
      description: Seconds to wait before retrying.
      schema: {type: integer}
    Idempotent-Replayed:
      description: '`true` when the response is a replay of an earlier request with the same Idempotency-Key.'
      schema: {type: string, enum: ['true']}

  responses:
    InvalidRequest:
      description: The request is malformed or violates the contract.
      headers: {X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthenticated:
      description: Missing, malformed or unknown credential.
      headers: {X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: unauthenticated, message: A valid bearer credential is required., retriable: false, request_id: req_0000000000000000}}
    PermissionDenied:
      description: Authenticated, but the credential lacks the scope or capability (or a human is required).
      headers: {X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: No such resource in the caller's tenant. A resource in another tenant is reported identically.
      headers: {X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: State conflict — illegal transition, mode locked, broker refusal, approval state.
      headers: {X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            modeLocked:
              value: {error: {code: mode_locked, message: MODE 2 is locked, retriable: false, request_id: req_0000000000000000, detail: {pending: [SHARED_RETRY_RECONCILIATION, BROKER_ROUTING, RSERIES_BRIDGE_CONTRACT_TESTS, APPROVAL_STORE, KILL_SWITCH, OPERATOR_ATTESTATION]}}}
            brokerRefused:
              value: {error: {code: broker_refused, message: The ops-broker refused the submission., retriable: false, request_id: req_0000000000000000, detail: {refusal_code: APPROVAL-REPLAY}}}
    IdempotencyConflict:
      description: The Idempotency-Key was already used with a different request body.
      headers: {X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RateLimited:
      description: Too many requests.
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
        Retry-After: {$ref: '#/components/headers/Retry-After'}
        RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
        RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
        RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unavailable:
      description: A dependency (ops-broker, R-Series) is unavailable. For POST /v1/executions this is answered only when the request provably did not reach dispatch.
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
        Retry-After: {$ref: '#/components/headers/Retry-After'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotImplemented:
      description: CONTRACT_ONLY operation — specified but not implemented by this server.
      headers: {X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}

  schemas:
    # ── scalars ─────────────────────────────────────────────────────────────
    ConnectorIdValue: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'}
    ConnectionIdValue: {type: string, pattern: '^conn_[A-Za-z0-9]{8,64}$'}
    RunIdValue:
      description: The EXEC-FACTS run_id.
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9_:.-]{7,127}$'
    PlanIdValue: {type: string, pattern: '^plan_[A-Za-z0-9]{8,64}$'}
    StepIdValue: {type: string, pattern: '^step_[A-Za-z0-9]{8,64}$'}
    ApprovalIdValue: {type: string, pattern: '^apr_[A-Za-z0-9]{8,64}$'}
    ReceiptIdValue: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_:.-]{0,127}$'}
    EventIdValue: {type: string, pattern: '^evt_[A-Za-z0-9]{8,64}$'}
    IdempotencyKeyValue: {type: string, minLength: 8, maxLength: 255, pattern: '^[A-Za-z0-9_.:-]{8,255}$'}
    Timestamp: {type: string, format: date-time}
    ApiEnvironment:
      description: Environment a credential is bound to. `hermetic` is the reference server only.
      type: string
      enum: [hermetic, staging, production]

    # ── frozen enums (x-dcs-enum-closed) ───────────────────────────────────
    ExecutionOutcome:
      description: EXEC-FACTS v1 outcome, verbatim. OUTCOME_UNKNOWN is never a failure and is never retried before reconciliation. STARTED is the only non-terminal dispatch state.
      type: string
      enum: [REFUSED, BLOCKED, STARTED, SUCCEEDED, FAILED, PROVIDER_UNAVAILABLE, OUTCOME_UNKNOWN, RETRY_SCHEDULED, RETRY_EXHAUSTED]
      x-dcs-enum-closed: contracts/v1.3/exec-facts.v1.json#/properties/outcome
    OperationClass:
      type: string
      enum: [read, write, admin]
      x-dcs-enum-closed: contracts/v1.3/exec-facts.v1.json#/properties/operation_class
    ProviderIdempotencySemantics:
      type: string
      enum: [provider_key_header, provider_native, client_dedupe, none]
      x-dcs-enum-closed: contracts/v1.3/exec-facts.v1.json
    RefusalClass:
      type: string
      enum: [invalid_request, permission, policy_denied, consent_missing, contract_unknown_field, manifest_unknown_value, trust_level_insufficient]
      x-dcs-enum-closed: contracts/v1.3/exec-facts.v1.json
    BlockedBy:
      type: string
      enum: [kill_switch, connection_revoked, lease_invalid, blast_radius, egress_policy, inbound_firewall, breaker_open, rate_limit_local, residency_policy]
      x-dcs-enum-closed: contracts/v1.3/exec-facts.v1.json
    ErrorClass:
      description: errors.v1 taxonomy, verbatim.
      type: string
      enum: [invalid_request, auth, permission, policy_denied, not_found, conflict, rate_limited, timeout, provider_unavailable, egress_blocked, breaker_open, internal]
      x-dcs-enum-closed: contracts/v1/errors.v1.json
    RunStatus:
      type: string
      enum: [open, awaiting_approval, blocked, escalated, closed]
      x-dcs-enum-closed: 'oal-runtime schemas.mjs run_state.status'
    RunMode:
      type: string
      enum: [mode_0, mode_1, mode_2]
      x-dcs-enum-closed: 'oal-runtime dependencies.mjs Mode'
    RunPhase:
      type: string
      enum: [observe, correlate, diagnose, plan, authorise, execute, verify, recover, escalate, close]
      x-dcs-enum-closed: 'oal-runtime dependencies.mjs Phase'
    PolicyDecisionValue:
      type: string
      enum: [allow, deny, require_approval]
      x-dcs-enum-closed: 'oal-runtime schemas.mjs policy_decision.decision'
    OalApprovalStatus:
      description: OAL approval status verbatim (EXPIRED derived from the clock, never stored).
      type: string
      enum: [ISSUED, CONSUMED, REVOKED, EXPIRED]
      x-dcs-enum-closed: 'oal-runtime approval.mjs ApprovalStatus'
    ReceiptStatus:
      type: string
      enum: [ISSUED, PENDING, FAILED]
      x-dcs-enum-closed: 'runtime evidence-slot.mjs ReceiptStatus'
    ReceiptDisplayStatus:
      description: Receipt status on an execution; adds `not_requested` for executions whose fact has not been submitted.
      type: string
      enum: [not_requested, ISSUED, PENDING, FAILED]
    VerificationLabel:
      type: string
      enum: [not_verified, verified, verification_failed, verification_unavailable, unverified_test_double]
      x-dcs-enum-closed: 'runtime evidence-slot.mjs VerificationLabel'
    EvidenceGrade:
      type: string
      enum: [rseries_verified, rseries_issued_unverified, test_double_not_evidence, none]
    VerifierKind:
      type: string
      enum: [rseries, test_double]
    KillScope:
      type: string
      enum: [system, tenant, connection, connector, tool]
      x-dcs-enum-closed: 'ops-broker kill-switch.mjs KillScope'
    ConnectionStatus:
      description: Runtime-E connection lifecycle. REVOKED is terminal.
      type: string
      enum: [CREATED, TESTED, ACTIVE, REVOKED]
      x-dcs-enum-closed: 'runtime connection.mjs ConnectionStatus'
    ConnectionHealth:
      type: string
      enum: [unknown, healthy, degraded, unhealthy, revoked]
      x-dcs-enum-closed: 'runtime connection.mjs HealthState'
    CredentialState:
      description: Auth credential state (packages/contracts ConnectionState). Only `connected` is dispatchable.
      type: string
      enum: [pending, connected, refreshing, degraded, revoked, expired]
      x-dcs-enum-closed: 'packages/contracts/src/types.mjs ConnectionState'
    ConnectorDisposition:
      type: string
      enum: [CODED_LOCALLY_TESTED, SPEC_READY, ACCESS_GATED, PARKED, BLOCKED, RETIRED, EXTERNAL_DEPENDENCY, FOUNDER_LEGAL, NOT_STARTED]
      x-dcs-enum-closed: 'packages/registry/src/catalogue.mjs Disposition'
    ReconciliationStrategy:
      type: string
      enum: [probe_by_idempotency_key, probe_by_resource_id, provider_list_scan, manual]
      x-dcs-enum-closed: 'packages/contracts/src/types.mjs ReconciliationStrategy'
    ApprovalState:
      description: |
        Public approval lifecycle. `REQUESTED` → (`GRANTED` | `DENIED` | `SUPERSEDED` | `EXPIRED`).
        `GRANTED` corresponds to OAL `ISSUED`; `CONSUMED`, `REVOKED`, `EXPIRED` mirror OAL verbatim.
        `oal_status` on the object carries the OAL value exactly.
      type: string
      enum: [REQUESTED, GRANTED, DENIED, CONSUMED, EXPIRED, REVOKED, SUPERSEDED]
      x-dcs-enum-open: true
    EventType:
      type: string
      enum: [approval.requested, approval.granted, approval.denied, approval.revoked, execution.state_changed, receipt.issued, receipt.failed, run.opened, run.closed, kill_order.activated, kill_order.restored, connection.revoked]
      x-dcs-enum-open: true
    Capability:
      type: string
      enum: [configure, approve, execute, kill, restore, view]
      x-dcs-enum-open: true

    # ── envelopes ───────────────────────────────────────────────────────────
    ListEnvelope:
      type: object
      required: [object, data, has_more, next_cursor]
      properties:
        object: {const: list}
        data: {type: array}
        has_more: {type: boolean}
        next_cursor: {type: [string, 'null']}
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: {$ref: '#/components/schemas/Error'}
    Error:
      type: object
      required: [code, message, retriable, request_id]
      additionalProperties: false
      properties:
        code: {$ref: '#/components/schemas/ErrorCode'}
        message:
          type: string
          description: Human-readable; never contains secrets, credentials or raw provider bodies.
        retriable:
          type: boolean
          description: Whether the *same* request may be retried. Always false for ambiguous writes.
        request_id: {type: string}
        detail:
          type: object
          description: Machine-readable context. Known keys — `refusal_code` (ops-broker code, verbatim), `pending` (MODE 2 dependencies), `field`, `scope`, `capability`, `from`/`to` (illegal transition), `retry_after_seconds`.
          additionalProperties: true
        docs_url: {type: string, format: uri}
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - secret_in_request
        - idempotency_key_required
        - idempotency_key_reuse
        - unauthenticated
        - permission_denied
        - human_required
        - not_found
        - conflict
        - illegal_transition
        - mode_locked
        - broker_refused
        - approval_not_grantable
        - rate_limited
        - dependency_unavailable
        - not_implemented
        - internal
      x-dcs-enum-open: true
      x-dcs-http-status:
        invalid_request: 400
        secret_in_request: 400
        idempotency_key_required: 400
        idempotency_key_reuse: 422
        unauthenticated: 401
        permission_denied: 403
        human_required: 403
        not_found: 404
        conflict: 409
        illegal_transition: 409
        mode_locked: 409
        broker_refused: 409
        approval_not_grantable: 409
        rate_limited: 429
        dependency_unavailable: 503
        not_implemented: 501
        internal: 500

    # ── identity ───────────────────────────────────────────────────────────
    Principal:
      type: object
      required: [object, kind, principal_id, tenant_id, environment, scopes, capabilities]
      properties:
        object: {const: principal}
        kind: {type: string, enum: [api_key, human]}
        principal_id: {type: string}
        tenant_id: {type: string}
        environment: {$ref: '#/components/schemas/ApiEnvironment'}
        scopes: {type: array, items: {type: string}}
        capabilities: {type: array, items: {$ref: '#/components/schemas/Capability'}}
        key_prefix: {type: string, description: 'Non-secret prefix only (e.g. cosk_staging_).'}

    # ── connectors ─────────────────────────────────────────────────────────
    Connector:
      type: object
      required: [object, connector_id, name, disposition, availability, dispatch]
      properties:
        object: {const: connector}
        connector_id: {$ref: '#/components/schemas/ConnectorIdValue'}
        name: {type: string}
        pack: {type: [string, 'null']}
        engineering_rank: {type: [integer, 'null']}
        generation: {type: [string, 'null'], description: 'Manifest generation (v1 or 1.3).'}
        disposition: {$ref: '#/components/schemas/ConnectorDisposition'}
        availability:
          description: |
            Derived strictly from dispatch eligibility. `dispatchable_production` only when production
            eligibility is true; `dispatchable_staging` only when staging eligibility is true; otherwise
            `not_dispatchable`. The API never reports "Available" for a connector that cannot dispatch.
          type: string
          enum: [dispatchable_production, dispatchable_staging, not_dispatchable]
        dispatch:
          type: object
          required: [staging, production, reasons]
          properties:
            staging: {type: boolean}
            production: {type: boolean}
            reasons: {type: array, items: {type: string}}
            production_reasons: {type: array, items: {type: string}}
        founder_holds: {type: array, items: {type: string}}

    # ── connections ────────────────────────────────────────────────────────
    RoutingContext:
      type: object
      additionalProperties: false
      properties:
        target: {type: string, description: '`simulator` is the only target the reference server accepts.'}
        environment: {type: string, enum: [production, sandbox, staging, development]}
        residency_requirement: {type: string}
        expected_account: {type: string}
        organization: {type: string}
    ConnectionCreate:
      type: object
      required: [connector_id, credential_ref]
      additionalProperties: false
      properties:
        connector_id: {$ref: '#/components/schemas/ConnectorIdValue'}
        credential_ref:
          type: string
          pattern: '^cref_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: Vault credential reference. Never a secret.
        routing: {$ref: '#/components/schemas/RoutingContext'}
        label: {type: string, maxLength: 64}
    Connection:
      type: object
      required: [object, connection_id, connector_id, status, health, credential_state, created_at]
      properties:
        object: {const: connection}
        connection_id: {$ref: '#/components/schemas/ConnectionIdValue'}
        connector_id: {$ref: '#/components/schemas/ConnectorIdValue'}
        label: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/ConnectionStatus'}
        health: {$ref: '#/components/schemas/ConnectionHealth'}
        credential_state: {$ref: '#/components/schemas/CredentialState'}
        credential_ref_present:
          type: boolean
          description: The credential reference itself is never returned; only whether one is bound.
        routing: {$ref: '#/components/schemas/RoutingContext'}
        last_tested_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        revoked_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    ConnectionTestResult:
      type: object
      required: [object, connection_id, ok, status, health, tested_at]
      properties:
        object: {const: connection_test}
        connection_id: {$ref: '#/components/schemas/ConnectionIdValue'}
        ok: {type: boolean}
        status: {$ref: '#/components/schemas/ConnectionStatus'}
        health: {$ref: '#/components/schemas/ConnectionHealth'}
        target: {type: string}
        error_class: {oneOf: [{$ref: '#/components/schemas/ErrorClass'}, {type: 'null'}]}
        tested_at: {$ref: '#/components/schemas/Timestamp'}

    # ── runs / plans ───────────────────────────────────────────────────────
    RunCreate:
      type: object
      required: [mode, objective]
      additionalProperties: false
      properties:
        mode: {type: string, enum: [mode_0, mode_1]}
        objective: {type: string, minLength: 3, maxLength: 500}
        connector_ids: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/ConnectorIdValue'}}
        window_seconds: {type: integer, minimum: 60, maximum: 86400, default: 3600}
    Run:
      type: object
      required: [object, run_id, mode, phase, status, trigger, window, opened_at, updated_at]
      properties:
        object: {const: run}
        run_id: {$ref: '#/components/schemas/RunIdValue'}
        mode: {$ref: '#/components/schemas/RunMode'}
        phase: {$ref: '#/components/schemas/RunPhase'}
        status: {$ref: '#/components/schemas/RunStatus'}
        objective: {type: [string, 'null']}
        trigger:
          type: object
          required: [kind]
          properties:
            kind: {type: string, enum: [ops_event, operator, schedule]}
            principal_id: {type: [string, 'null']}
        window:
          type: object
          required: [not_before, not_after]
          properties:
            not_before: {$ref: '#/components/schemas/Timestamp'}
            not_after: {$ref: '#/components/schemas/Timestamp'}
        connector_ids: {type: array, items: {$ref: '#/components/schemas/ConnectorIdValue'}}
        plan_ids: {type: array, items: {$ref: '#/components/schemas/PlanIdValue'}}
        approval_ids: {type: array, items: {$ref: '#/components/schemas/ApprovalIdValue'}}
        execution_ids: {type: array, items: {type: string, format: uuid}}
        opened_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    PlanStepCreate:
      type: object
      required: [connector_id, tool_id, operation_class]
      additionalProperties: false
      properties:
        connector_id: {$ref: '#/components/schemas/ConnectorIdValue'}
        tool_id: {type: string, minLength: 1, maxLength: 128}
        operation_class: {$ref: '#/components/schemas/OperationClass'}
        connection_id: {$ref: '#/components/schemas/ConnectionIdValue'}
        rationale: {type: string, maxLength: 500}
    PlanCreate:
      type: object
      required: [steps]
      additionalProperties: false
      properties:
        operator_explanation: {type: string, maxLength: 1000}
        steps: {type: array, minItems: 1, maxItems: 32, items: {$ref: '#/components/schemas/PlanStepCreate'}}
    PlanStep:
      type: object
      required: [step_id, connector_id, tool_id, operation_class, policy_decision]
      properties:
        step_id: {$ref: '#/components/schemas/StepIdValue'}
        connector_id: {$ref: '#/components/schemas/ConnectorIdValue'}
        connector_version: {type: [string, 'null']}
        tool_id: {type: string}
        operation_class: {$ref: '#/components/schemas/OperationClass'}
        connection_id: {oneOf: [{$ref: '#/components/schemas/ConnectionIdValue'}, {type: 'null'}]}
        rationale: {type: [string, 'null']}
        policy_decision: {$ref: '#/components/schemas/PolicyDecision'}
    Plan:
      type: object
      required: [object, plan_id, run_id, revision, recommendation_only, steps, created_at]
      properties:
        object: {const: plan}
        plan_id: {$ref: '#/components/schemas/PlanIdValue'}
        run_id: {$ref: '#/components/schemas/RunIdValue'}
        revision: {type: integer, minimum: 1}
        recommendation_only: {const: true}
        operator_explanation: {type: [string, 'null']}
        steps: {type: array, items: {$ref: '#/components/schemas/PlanStep'}}
        created_at: {$ref: '#/components/schemas/Timestamp'}

    # ── policies ───────────────────────────────────────────────────────────
    Policy:
      type: object
      required: [object, policy_id, name, version, status, rules]
      properties:
        object: {const: policy}
        policy_id: {type: string}
        name: {type: string}
        version: {type: string}
        status: {type: string, enum: [active, disabled, draft]}
        rules:
          type: array
          items:
            type: object
            required: [operation_class, decision]
            properties:
              operation_class: {$ref: '#/components/schemas/OperationClass'}
              decision: {$ref: '#/components/schemas/PolicyDecisionValue'}
              note: {type: string}
    PolicyEvaluateRequest:
      type: object
      required: [connector_id, tool_id, operation_class]
      additionalProperties: false
      properties:
        connector_id: {$ref: '#/components/schemas/ConnectorIdValue'}
        tool_id: {type: string, minLength: 1, maxLength: 128}
        operation_class: {$ref: '#/components/schemas/OperationClass'}
        environment: {type: string, enum: [staging, production]}
    PolicyDecision:
      type: object
      required: [object, decision, policy_id, reasons]
      properties:
        object: {const: policy_decision}
        decision: {$ref: '#/components/schemas/PolicyDecisionValue'}
        policy_id: {type: string}
        decision_id: {type: [string, 'null']}
        reasons: {type: array, items: {type: string}}
        dispatch_eligible:
          type: [boolean, 'null']
          description: Registry eligibility for the requested environment (null when no environment was given). A policy `allow` does not make an ineligible connector dispatchable.

    # ── approvals ──────────────────────────────────────────────────────────
    ApprovalRequest:
      type: object
      required: [run_id, plan_id, step_ids]
      additionalProperties: false
      properties:
        run_id: {$ref: '#/components/schemas/RunIdValue'}
        plan_id: {$ref: '#/components/schemas/PlanIdValue'}
        step_ids: {type: array, minItems: 1, maxItems: 32, items: {$ref: '#/components/schemas/StepIdValue'}}
        note: {type: string, maxLength: 500}
    ApprovalGrant:
      type: object
      additionalProperties: false
      properties:
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 900
          description: Default 15 min (ops-broker default); maximum 24 h (OAL MAX_APPROVAL_TTL_MS).
        note: {type: string, maxLength: 500}
    ReasonBody:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 3, maxLength: 500}
    ReviewedReasonBody:
      type: object
      required: [reason, reviewer]
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 3, maxLength: 500}
        reviewer: {type: string, minLength: 3, maxLength: 128}
    ApprovedStep:
      type: object
      required: [step_id, operation_class]
      properties:
        step_id: {$ref: '#/components/schemas/StepIdValue'}
        operation_class: {$ref: '#/components/schemas/OperationClass'}
        execution_id: {type: [string, 'null'], format: uuid, description: 'Broker-minted at grant; null before.'}
        consumed_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        recorded_outcome: {oneOf: [{$ref: '#/components/schemas/ExecutionOutcome'}, {type: 'null'}]}
    Approval:
      type: object
      required: [object, approval_id, state, oal_status, run_id, plan_id, steps, requested_at]
      properties:
        object: {const: approval}
        approval_id: {$ref: '#/components/schemas/ApprovalIdValue'}
        state: {$ref: '#/components/schemas/ApprovalState'}
        oal_status: {oneOf: [{$ref: '#/components/schemas/OalApprovalStatus'}, {type: 'null'}]}
        run_id: {$ref: '#/components/schemas/RunIdValue'}
        plan_id: {$ref: '#/components/schemas/PlanIdValue'}
        plan_revision: {type: integer}
        steps: {type: array, items: {$ref: '#/components/schemas/ApprovedStep'}}
        requested_by: {type: [string, 'null']}
        approved_by:
          oneOf:
            - type: 'null'
            - type: object
              required: [kind, principal_id]
              properties:
                kind: {const: human}
                principal_id: {type: string}
        decision_reason: {type: [string, 'null']}
        policy_id: {type: [string, 'null']}
        requested_at: {$ref: '#/components/schemas/Timestamp'}
        granted_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        expires_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}

    # ── executions ─────────────────────────────────────────────────────────
    ExecutionSubmit:
      type: object
      required: [run_id, plan_id, step_id]
      additionalProperties: false
      description: Identifies a plan step. `approval_id` is required whenever the step's policy decision is `require_approval` (the broker refuses with `APPROVAL-REQUIRED` otherwise). `execution_id`, `idempotency_key` and every other broker-minted field are refused if present.
      properties:
        run_id: {$ref: '#/components/schemas/RunIdValue'}
        plan_id: {$ref: '#/components/schemas/PlanIdValue'}
        step_id: {$ref: '#/components/schemas/StepIdValue'}
        approval_id: {$ref: '#/components/schemas/ApprovalIdValue'}
    Attempt:
      description: One EXEC-FACTS fact, projected. Facts are append-only.
      type: object
      required: [attempt_n, outcome, recorded_at]
      properties:
        attempt_n: {type: integer, minimum: 1, maximum: 100}
        outcome: {$ref: '#/components/schemas/ExecutionOutcome'}
        refusal_class: {$ref: '#/components/schemas/RefusalClass'}
        blocked_by: {$ref: '#/components/schemas/BlockedBy'}
        error_class: {$ref: '#/components/schemas/ErrorClass'}
        provider_request_id: {type: string}
        provider_status: {type: integer}
        reconciliation_ref: {type: string, pattern: '^rcn_[A-Za-z0-9_-]{8,128}$'}
        verification_ref: {type: string, pattern: '^vrf_[A-Za-z0-9_-]{8,128}$'}
        retry_at: {$ref: '#/components/schemas/Timestamp'}
        recorded_at: {$ref: '#/components/schemas/Timestamp'}
    ExecutionReceipt:
      description: Receipt state for this execution — deliberately separate from `outcome`.
      type: object
      required: [status, verification, evidence_grade]
      properties:
        status: {$ref: '#/components/schemas/ReceiptDisplayStatus'}
        receipt_id: {type: [string, 'null']}
        verification: {$ref: '#/components/schemas/VerificationLabel'}
        evidence_grade: {$ref: '#/components/schemas/EvidenceGrade'}
    Execution:
      type: object
      required: [object, execution_id, run_id, connector_id, tool_id, operation_class, outcome, settled, attempts, receipt, created_at, updated_at]
      properties:
        object: {const: execution}
        execution_id: {type: string, format: uuid}
        run_id: {$ref: '#/components/schemas/RunIdValue'}
        plan_id: {oneOf: [{$ref: '#/components/schemas/PlanIdValue'}, {type: 'null'}]}
        step_id: {oneOf: [{$ref: '#/components/schemas/StepIdValue'}, {type: 'null'}]}
        approval_id: {oneOf: [{$ref: '#/components/schemas/ApprovalIdValue'}, {type: 'null'}]}
        connection_id: {oneOf: [{$ref: '#/components/schemas/ConnectionIdValue'}, {type: 'null'}]}
        connector_id: {$ref: '#/components/schemas/ConnectorIdValue'}
        connector_version: {type: [string, 'null']}
        tool_id: {type: string}
        operation_class: {$ref: '#/components/schemas/OperationClass'}
        provider_idempotency_semantics: {$ref: '#/components/schemas/ProviderIdempotencySemantics'}
        outcome:
          $ref: '#/components/schemas/ExecutionOutcome'
        settled:
          type: boolean
          description: True when `outcome` is terminal (REFUSED, BLOCKED, SUCCEEDED, FAILED, PROVIDER_UNAVAILABLE, RETRY_EXHAUSTED). OUTCOME_UNKNOWN and STARTED are never settled.
        attempts: {type: array, items: {$ref: '#/components/schemas/Attempt'}}
        reconciliation:
          type: object
          properties:
            required: {type: boolean}
            reconciliation_ref: {type: [string, 'null']}
            strategy: {oneOf: [{$ref: '#/components/schemas/ReconciliationStrategy'}, {type: 'null'}]}
            status: {type: string, enum: [not_required, pending, reconciled]}
        verification:
          type: object
          properties:
            verification_ref: {type: [string, 'null']}
            verdict: {type: [string, 'null'], enum: [verified, not_verified, inconclusive, null]}
        receipt: {$ref: '#/components/schemas/ExecutionReceipt'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    ReconcileRequest:
      type: object
      required: [outcome, evidence]
      additionalProperties: false
      properties:
        outcome: {type: string, enum: [SUCCEEDED, FAILED]}
        evidence:
          type: object
          required: [method, note]
          additionalProperties: false
          properties:
            method: {type: string, enum: [read_back_by_resource_id, read_back_by_idempotency_key, provider_list_scan, manual]}
            provider_request_id: {type: string, maxLength: 256}
            note: {type: string, minLength: 3, maxLength: 1000}

    # ── receipts ───────────────────────────────────────────────────────────
    ReceiptRef:
      description: ToolResult v1 receipt_ref shape.
      type: object
      required: [receipt_id, v]
      properties:
        receipt_id: {type: string, minLength: 1, maxLength: 128}
        v: {type: integer, minimum: 1}
        inputs_hash: {type: string}
        outputs_hash: {type: string}
    Receipt:
      type: object
      required: [object, receipt_id, status, execution_id, attempt_n, execution_outcome, profile, profile_version]
      properties:
        object: {const: receipt}
        receipt_id: {$ref: '#/components/schemas/ReceiptIdValue'}
        status: {$ref: '#/components/schemas/ReceiptStatus'}
        execution_id: {type: string, format: uuid}
        run_id: {$ref: '#/components/schemas/RunIdValue'}
        attempt_n: {type: integer, minimum: 1}
        execution_outcome: {$ref: '#/components/schemas/ExecutionOutcome'}
        profile: {const: cos-ops-v1}
        profile_version: {type: string}
        parent_receipt: {type: [string, 'null']}
        seq: {type: [integer, 'null']}
        recovery_state: {type: [string, 'null'], description: 'R-Series-derived (e.g. NONE, KILL_SWITCH, HUMAN_INTERVENTION, RECONCILED, RECOVERED).'}
        receipt_ref: {oneOf: [{$ref: '#/components/schemas/ReceiptRef'}, {type: 'null'}]}
        issued_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        issuer_kind: {$ref: '#/components/schemas/VerifierKind'}
        document:
          description: The R-Series receipt document as issued (opaque to Connector OS). Null while PENDING or FAILED.
          type: [object, 'null']
          additionalProperties: true
    ReceiptVerification:
      type: object
      required: [object, receipt_id, verification, verifier_kind, evidence_grade, checked_at]
      properties:
        object: {const: receipt_verification}
        receipt_id: {$ref: '#/components/schemas/ReceiptIdValue'}
        verification: {$ref: '#/components/schemas/VerificationLabel'}
        verifier_kind: {$ref: '#/components/schemas/VerifierKind'}
        code: {type: [string, 'null'], description: 'Verifier code verbatim (OK, COS-VERIFY-*, COS-CHAIN-BROKEN).'}
        execution_outcome_matches: {type: [boolean, 'null']}
        profile_status: {type: [string, 'null']}
        evidence_grade: {$ref: '#/components/schemas/EvidenceGrade'}
        checked_at: {$ref: '#/components/schemas/Timestamp'}

    # ── events / webhooks ──────────────────────────────────────────────────
    Event:
      type: object
      required: [object, event_id, type, occurred_at, dedupe_key, data]
      properties:
        object: {const: event}
        event_id: {$ref: '#/components/schemas/EventIdValue'}
        type: {$ref: '#/components/schemas/EventType'}
        occurred_at: {$ref: '#/components/schemas/Timestamp'}
        dedupe_key:
          type: string
          description: Stable identity for consumer-side deduplication; identical across redeliveries.
        run_id: {type: [string, 'null']}
        data:
          type: object
          description: Reference-only payload (ids, states, outcomes). Never provider bodies or secrets.
          additionalProperties: true
    WebhookEndpointCreate:
      type: object
      required: [url, event_types]
      additionalProperties: false
      properties:
        url: {type: string, format: uri, pattern: '^https://'}
        event_types: {type: array, minItems: 1, items: {$ref: '#/components/schemas/EventType'}}
        description: {type: string, maxLength: 200}
    WebhookEndpoint:
      type: object
      required: [object, webhook_id, url, event_types, status, created_at]
      properties:
        object: {const: webhook_endpoint}
        webhook_id: {type: string}
        url: {type: string, format: uri}
        event_types: {type: array, items: {$ref: '#/components/schemas/EventType'}}
        status: {type: string, enum: [enabled, disabled]}
        signing:
          type: object
          description: Signing scheme is NOT DEFINED (founder decision FD-L5-1). Consumers must treat deliveries as unauthenticated until it is.
          properties:
            scheme: {type: [string, 'null']}
        created_at: {$ref: '#/components/schemas/Timestamp'}

    # ── environments / usage ───────────────────────────────────────────────
    Environment:
      type: object
      required: [object, name, dispatchable_connectors, dispatchable_tools]
      properties:
        object: {const: environment}
        name: {type: string, enum: [staging, production]}
        dispatchable_connectors: {type: integer, minimum: 0}
        dispatchable_tools: {type: [integer, 'null'], minimum: 0}
        catalogued_connectors: {type: integer, minimum: 0}
        mode_ceiling: {$ref: '#/components/schemas/RunMode'}
        notes: {type: array, items: {type: string}}
    Usage:
      type: object
      required: [object, window, executions, receipts]
      properties:
        object: {const: usage}
        window: {type: string, enum: [24h, 7d, 30d]}
        executions:
          type: object
          required: [total, by_outcome]
          properties:
            total: {type: integer, minimum: 0}
            by_outcome:
              type: object
              additionalProperties: {type: integer, minimum: 0}
        receipts:
          type: object
          required: [ISSUED, PENDING, FAILED]
          properties:
            ISSUED: {type: integer, minimum: 0}
            PENDING: {type: integer, minimum: 0}
            FAILED: {type: integer, minimum: 0}
        by_connector:
          type: array
          items:
            type: object
            required: [connector_id, executions]
            properties:
              connector_id: {type: string}
              executions: {type: integer}
        cost_note: {type: string}

    # ── operator ───────────────────────────────────────────────────────────
    KillOrderCreate:
      type: object
      required: [scope, target, reason, reviewer]
      additionalProperties: false
      properties:
        scope: {$ref: '#/components/schemas/KillScope'}
        target:
          type: string
          minLength: 1
          maxLength: 200
          description: "`*` for system; the tenant/connection/connector id; `<connector_id>/<tool_id>` for tool."
        reason: {type: string, minLength: 3, maxLength: 500}
        reviewer: {type: string, minLength: 3, maxLength: 128}
    KillOrder:
      type: object
      required: [object, kill_order_id, scope, target, state, reason, reviewer, initiated_by, activated_at]
      properties:
        object: {const: kill_order}
        kill_order_id: {type: string}
        scope: {$ref: '#/components/schemas/KillScope'}
        target: {type: string}
        state: {type: string, enum: [active, restored]}
        writes_only: {type: boolean, description: 'True for scope system — reads continue.'}
        reason: {type: string}
        reviewer: {type: string}
        initiated_by: {type: string}
        activated_at: {$ref: '#/components/schemas/Timestamp'}
        restored_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        restore_reason: {type: [string, 'null']}
    AuditExportCreate:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from: {$ref: '#/components/schemas/Timestamp'}
        to: {$ref: '#/components/schemas/Timestamp'}
        classes: {type: array, items: {type: string, enum: [approvals, executions, kill_orders, connections, receipts]}}
    AuditExport:
      type: object
      required: [object, export_id, status]
      properties:
        object: {const: audit_export}
        export_id: {type: string}
        status: {type: string, enum: [queued, running, complete, failed]}
        download_url: {type: [string, 'null'], format: uri}
    EligibilityReport:
      type: object
      required: [object, schema, summary]
      properties:
        object: {const: eligibility_report}
        schema: {type: string}
        summary:
          type: object
          additionalProperties: true
        check:
          type: [object, 'null']
          properties:
            connector_id: {type: string}
            tool_id: {type: [string, 'null']}
            environment: {type: string}
            dispatchable: {type: boolean}
            reasons: {type: array, items: {type: string}}
            requires: {type: [object, 'null'], additionalProperties: true}
    ProviderHealth:
      type: object
      required: [connector_id, connections, health]
      properties:
        connector_id: {type: string}
